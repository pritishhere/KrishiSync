services:
  - type: web
    name: krishisync-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: MANDI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
